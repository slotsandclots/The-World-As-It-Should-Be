<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The World As It Should Be</title>
  <meta name="description" content="A political simulator: lead any nation on a randomly generated world through elections, coups, revolutions and wars.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="The World As It Should Be"><svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 16h28M16 2c5 4 6.5 9 6.5 14S21 26 16 30M16 2c-5 4-6.5 9-6.5 14S11 26 16 30" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M16 7l2 4.2 4.6.6-3.3 3.2.8 4.6L16 17.4l-4.1 2.2.8-4.6-3.3-3.2 4.6-.6z" fill="currentColor"/></svg><span>The World<br><i>As It Should Be</i></span></div>
    <div id="tb-nation" class="tb-nation"></div>
    <div id="tb-stats" class="tb-stats"></div>
    <div class="tb-controls">
      <span id="tb-date" class="tb-date" data-tip="date"></span>
      <div class="speed" role="group" aria-label="Game speed">
        <button data-speed="0" title="Pause (Space)">❚❚</button>
        <button data-speed="1" title="Normal speed (1)">▶</button>
        <button data-speed="2" title="Fast (2)">▶▶</button>
        <button data-speed="3" title="Very fast (3)">▶▶▶</button>
      </div>
      <button id="btn-next" class="primary" title="Advance one month (N)">Next month ⏭</button>
      <button id="btn-menu" title="Menu">☰</button>
    </div>
  </header>

  <div id="alertbar" class="hidden"></div>
  <main id="main">
    <section id="map-wrap">
      <div id="map-inner">
        <canvas id="map"></canvas>
      </div>
      <canvas id="labels"></canvas>
      <div id="map-zoom"><button data-zoom="in" title="Zoom in (or scroll)">+</button><button data-zoom="out" title="Zoom out">−</button><button data-zoom="reset" title="Reset view">⤢</button></div>
      <div id="map-tooltip" class="hidden"></div>
      <div id="map-modes"></div>
      <div id="campaign-box" class="hidden"></div>
      <div id="choose-banner" class="hidden">Click a nation on the map to inspect it, then choose <b>Lead this nation</b>.</div>
    </section>
    <aside id="panel">
      <nav id="tabs"></nav>
      <div id="tab-body"></div>
    </aside>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/rng.js"></script>
  <script src="js/names.js"></script>
  <script src="js/governments.js"></script>
  <script src="js/earth-data.js"></script>
  <script src="js/mapgen.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/empire.js"></script>
  <script src="js/blocs.js"></script>
  <script src="js/federal.js"></script>
  <script src="js/coalitions.js"></script>
  <script src="js/laws.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/warfare.js"></script>
  <script src="js/money.js"></script>
  <script src="js/credit.js"></script>
  <script src="js/fiscal.js"></script>
  <script src="js/peoples.js"></script>
  <script src="js/society.js"></script>
  <script src="js/tradeflows.js"></script>
  <script src="js/ideas.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/tech.js"></script>
  <script src="js/movements.js"></script>
  <script src="js/figures.js"></script>
  <script src="js/portrait.js"></script>
  <script src="js/art.js"></script>
  <script src="js/events.js"></script>
  <script src="js/revanchism.js"></script>
  <script src="js/worldwar.js"></script>
  <script src="js/campaign.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui-views.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
